<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BusDirect : gestion des réservations de sièges de la ligne Safi → Marrakech.">
    <title>BusDirect — Gestion des Réservations de Places</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet">
</head>
  <body class="min-h-screen bg-slate-100 text-slate-900 flex flex-col">

  <header class="border-b-4  bg-slate-900 text-white">
    <div class="mx-auto flex max-w-6xl flex-col gap-1 px-4 py-5 sm:flex-row sm:items-center sm:justify-between">
      
       <h1 class="text-2xl font-bold md:text-3xl text-amber-200">
         <img class="w-20 inline" src="Gemini_Generated_Image_mb9sgimb9sgimb9s-removebg-preview.png" alt="BusDirect"><span class="text-blue-600">Bus</span><span class="text-yellow-500">Direct</span></h1>
         <strong><span class="text-blue-600 text-xl">Safi<span><span class="text-white text-xl"> ⮕</span><span class="text-yellow-500 text-xl"> Marrakech</span></strong>
    </div>
    </header>
    <main class="grow">
      <section class="grid grid-cols-1 gap-4 sm:grid-cols-3">
      <div class="border-2 rounded-lg h-28 p-7 m-5">
        <p class="text-sm text-slate-700">Places disponibles</p>
        <p class="text-3xl font-bold text-emerald-700"><span id="available">20</span> / 20</p>
      </div>
      <div class="border-2 rounded-lg h-28 p-7 m-5">
        <p class="text-sm text-slate-700">Places occupées</p>
        <p id="occupied" class="text-3xl font-bold text-rose-700">0</p>
      </div>
      <div class="border-2 rounded-lg h-28 p-7 m-5">
        <p class="text-sm text-slate-700">Recette totale (80 DH / place)</p>
        <p id="revenue" class="text-3xl font-bold">0 DH</p>
      </div>
    </section>

    
  </main>
    <footer class=" bg-slate-900 text-slate-300 py-4 text-center w-full ">
        <p>@2026.BusDirect</p>
    </footer>
    
</body>
</html>
